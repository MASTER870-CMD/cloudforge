# ================================================================
# CloudForge — Docker Compose (Local Development)
# ================================================================
# Run with: docker compose up
# This starts the app + LocalStack (AWS simulator) in one command.
# ================================================================

services:
  # ---------- CloudForge App ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudforge-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/cloudforge.db
      - APP_VERSION=1.0.0
    volumes:
      # Persist SQLite database across container restarts
      - cloudforge-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloudforge-net

  # ---------- LocalStack (AWS Simulator) ----------
  # Used by Terraform in Stage 3 — simulates S3, DynamoDB, IAM locally
  localstack:
    image: localstack/localstack:latest
    container_name: cloudforge-localstack
    ports:
      - "4566:4566"      # LocalStack Gateway
      - "4510-4559:4510-4559"  # External service ports
    environment:
      - SERVICES=s3,dynamodb,iam
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudforge-net

volumes:
  cloudforge-data:
    driver: local
  localstack-data:
    driver: local

networks:
  cloudforge-net:
    driver: bridge
